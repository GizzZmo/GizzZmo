# Profile README — dynamic section updater
# Only rewrites content between marker comments. Curated top of README is never touched.

name: Update Profile README

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Never auto-commit from pull_request events
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
          else
            npm install --ignore-scripts || true
          fi

      - name: Update dynamic date
        run: |
          CURRENT_DATE=$(date -u '+%B %d, %Y at %H:%M UTC')
          if grep -q '<!-- DYNAMIC_DATE -->' README.md; then
            # Replace content between DYNAMIC_DATE markers only
            sed -i -E "s|(<!-- DYNAMIC_DATE -->).*?(<!-- /DYNAMIC_DATE -->)|\1${CURRENT_DATE}\2|" README.md
            echo "Date set to: $CURRENT_DATE"
          else
            echo "No DYNAMIC_DATE markers found — skipping date update"
          fi

      - name: Update pinned / highlighted repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scripts/update-pinned-repos.js ]; then
            node scripts/update-pinned-repos.js || echo "⚠️ update-pinned-repos failed (non-fatal)"
          else
            echo "scripts/update-pinned-repos.js not found — skip"
          fi

      - name: Generate repository index + stats badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scripts/generate-repo-index.js ]; then
            node scripts/generate-repo-index.js || echo "⚠️ generate-repo-index failed (non-fatal)"
          else
            echo "scripts/generate-repo-index.js not found — skip"
          fi

      - name: Record last update
        run: |
          mkdir -p .github
          echo "Last successful profile update: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/last-update.txt

      - name: Commit and push if changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add README.md .github/last-update.txt || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: auto-update profile dynamic sections $(date -u '+%Y-%m-%d')"

          # Only push on main
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Not on main — commit created locally only"
            exit 0
          fi

          git pull --rebase origin main || {
            echo "::error::Rebase failed; aborting push"
            git rebase --abort || true
            exit 1
          }
          git push origin HEAD:main
          echo "✅ Profile dynamic sections updated"

  # Lightweight health check (runs on PR too if you add pull_request later)
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Community + README health
        run: |
          echo "=== Health check ==="
          for f in README.md LICENSE .gitignore CONTRIBUTING.md; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ missing $f"; fi
          done

          if [ -f README.md ]; then
            SIZE=$(wc -c < README.md)
            echo "README.md size: $SIZE bytes"
            if [ "$SIZE" -gt 200000 ]; then
              echo "⚠️ README is very large — consider trimming non-dynamic content"
            elif [ "$SIZE" -gt 80000 ]; then
              echo "⚠️ README is large"
            else
              echo "✅ README size is reasonable"
            fi

            for marker in "DYNAMIC_DATE" "STATS_BADGES_START" "STATS_BADGES_END" "DYNAMIC_REPOS_START" "DYNAMIC_REPOS_END" "REPO_INDEX_START" "REPO_INDEX_END"; do
              if grep -q "$marker" README.md; then
                echo "✅ marker $marker present"
              else
                echo "⚠️ marker $marker missing"
              fi
            done
          fi
